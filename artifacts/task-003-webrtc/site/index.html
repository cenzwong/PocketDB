<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PocketDB WebRTC probe</title>
  <script type="module" src="./probe.js"></script>
</head>
<body>
  <h1>PocketDB WebRTC probe</h1>
  <p>Open one page per peer. Exchange the offer and answer between pages you control.</p>
  <p>
    <button id="offer">Create client offer</button>
    <button id="answer">Accept offer and create host answer</button>
    <button id="connect">Accept answer on client</button>
  </p>
  <p><label for="incoming">Remote signal</label><br><textarea id="incoming" rows="5" cols="60"></textarea></p>
  <p><label for="outgoing">Local signal</label><br><textarea id="outgoing" rows="5" cols="60" readonly></textarea></p>
  <p>
    <button id="run" disabled>Run client write, read and size checks</button>
    <button id="disconnect" disabled>Close this peer</button>
  </p>
  <pre id="result" role="status"></pre>
</body>
</html>
