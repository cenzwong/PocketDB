<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>PocketDB PostgreSQL wire host</title>
<h1>PocketDB PostgreSQL wire host</h1>
<script type="module">
  import { browserPeer } from "./peer-rpc.js";
  const worker = new Worker("./database.js", { type: "module" });
  const pending = new Map();
  let sequence = 0;
  worker.onmessage = ({ data }) => {
    const waiter = pending.get(data.id);
    pending.delete(data.id);
    if (data.error) waiter.reject(new Error(data.error));
    else waiter.resolve(data.value);
  };
  function dispatch(request) {
    return new Promise((resolve, reject) => {
      const id = ++sequence;
      pending.set(id, { resolve, reject });
      worker.postMessage({ id, request });
    });
  }
  globalThis.probePeer = browserPeer(dispatch);
  globalThis.probeInspection = () => dispatch({ type: "inspect" });
</script>
