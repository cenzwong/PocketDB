name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      POCKETDB_CHROMIUM: /usr/bin/google-chrome
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 11.25.0
          run_install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Unit tests
        shell: bash
        run: |
          mkdir -p test-results
          pnpm test 2>&1 | tee test-results/unit.log
      - name: Browser integration
        shell: bash
        run: pnpm test:browser 2>&1 | tee test-results/browser.log
      - run: pnpm build
      - name: Verify Pages artifact
        shell: bash
        run: pnpm test:pages:artifact 2>&1 | tee test-results/pages.log
      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: pocketdb-test-results
          path: test-results/
          retention-days: 30
          if-no-files-found: ignore
      - uses: actions/upload-pages-artifact@v4
        with:
          path: apps/web/dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
